name: PR Comment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  comment:
    name: Comment on PR
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: ${{ github.event.workflow_run.id }}
        name: ${{ github.event.workflow_run.name }}
        path: comment-data
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - id: pr-number
      shell: bash
      run: echo "number=$(cat comment-data/pr-number)" >> "$GITHUB_OUTPUT"
    - shell: bash
      run: |
        {
          echo
          cat comment-data/log-md
        } >> comment-data/contents || true
    - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
      with:
        file-path: comment-data/contents
        mode: recreate
        pr-number: ${{ steps.pr-number.outputs.number }}
        comment-tag: ${{ github.event.workflow_run.name }}-comment
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - QNS PR
    - cargo bench
    - Performance comparison
    types:
    - completed
